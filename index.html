<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Tools | Indepth Accounting</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--sage:#94B6AB;--deep:#56776C;--ink:#414042;--paper:#fff;--tint:#F1F6F4;--tint2:#E3EDE9;--line:#DCE4E1;--muted:#7C8481;--font:"Montserrat","Century Gothic",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--ink:#ECEFEE;--paper:#414042;--tint:#4A4B4D;--tint2:#55625E;--line:#55595B;--muted:#B5BBB9;--deep:#A9C7BD}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--font);display:grid;grid-template-columns:minmax(300px,38%) 1fr;min-height:100vh}
aside{background:#56776C;color:#fff;padding:48px 48px 40px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
aside img{height:36px;width:auto;align-self:flex-start}
.hello{margin-top:auto}
.hello .day{font-size:13px;opacity:.8;margin:0 0 10px}
.hello h1{font-weight:300;font-size:44px;line-height:1.1;margin:0 0 14px;letter-spacing:-.01em}
.hello p{margin:0 0 30px;max-width:34ch;opacity:.92}
.search{position:relative}
.search input{width:100%;border:none;border-radius:3px;padding:14px 44px 14px 16px;font:inherit;color:#414042;background:#fff}
.search input:focus{outline:3px solid #94B6AB;outline-offset:0}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:500 12px var(--font);color:#7C8481;border:1px solid #DCE4E1;border-radius:3px;padding:1px 7px}
aside small{margin-top:28px;font-size:12px;opacity:.75;max-width:40ch}
main{padding:56px 56px 64px;max-width:820px}
h2{font-weight:500;font-size:13px;color:var(--muted);margin:0 0 6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
section{margin-bottom:38px}
a.tool{display:grid;grid-template-columns:52px 1fr auto;gap:2px 18px;align-items:start;padding:18px 14px 18px 10px;margin:0 -14px 0 -10px;border-radius:4px;text-decoration:none;color:inherit;transition:background .15s}
a.tool:hover,a.tool:focus-visible{background:var(--tint);outline:none}
a.tool:focus-visible{box-shadow:inset 0 0 0 2px var(--sage)}
.icon{grid-row:1/3;width:52px;height:52px;border-radius:50%;background:var(--tint2);display:flex;align-items:center;justify-content:center;color:var(--deep);transition:background .15s,color .15s}
a.tool:hover .icon,a.tool:focus-visible .icon{background:#56776C;color:#fff}
.icon svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.name{font-weight:500;font-size:17px;color:var(--ink);padding-top:3px}
.desc{grid-column:2;font-size:14px;color:var(--muted);max-width:56ch}
.need{grid-row:1;grid-column:3;font-size:12px;color:var(--deep);white-space:nowrap;padding-top:6px;display:flex;align-items:center;gap:6px}
.need.lock::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sage)}
.empty{color:var(--muted);display:none}
@media (max-width:860px){
  body{display:block}
  aside{position:static;height:auto;padding:28px 22px 30px}
  .hello{margin-top:34px}.hello h1{font-size:32px}
  main{padding:30px 22px 48px}
  .search kbd{display:none}
  a.tool{grid-template-columns:44px 1fr}.icon{width:44px;height:44px}
  .need{grid-row:auto;grid-column:2;padding-top:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    desc: "Draws a client group's entities and relationships, and exports the organisational chart as a PDF.", tags: "org chart organisational structure entities trust company" },
  { group: "Client documents", name: "PDF Redaction", href: "/redaction/", icon: "redact",
    desc: "Finds and removes TFNs, bank details and other identifiers from a PDF before it's shared.", tags: "redact tfn privacy medicare bsb" },
];
const now = new Date(), h = now.getHours();
document.getElementById("greet").textContent = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
document.getElementById("day").textContent = now.toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const box = document.getElementById("tools");
function render(q) {
  q = (q || "").toLowerCase().trim(); const groups = {}; let shown = 0;
  for (const t of TOOLS) {
    if (q && !(t.name + " " + t.desc + " " + t.tags + " " + t.group).toLowerCase().includes(q)) continue;
    (groups[t.group] = groups[t.group] || []).push(t); shown++;
  }
  box.innerHTML = Object.entries(groups).map(([g, ts]) => `<section><h2>${g}</h2>${ts.map((t) =>
    `<a class="tool" href="${t.href}"><span class="icon" aria-hidden="true">${ICONS[t.icon]}</span><span class="name">${t.name}</span><span class="need${t.signin ? " lock" : ""}">${t.signin ? "Microsoft sign-in" : "Opens straight away"}</span><span class="desc">${t.desc}</span></a>`).join("")}</section>`).join("");
  document.getElementById("none").style.display = shown ? "none" : "block";
}
const q = document.getElementById("q");
q.addEventListener("input", (e) => render(e.target.value));
q.addEventListener("keydown", (e) => { if (e.key === "Enter") { const a = box.querySelector("a.tool"); if (a) location.href = a.href; } });
document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); } });
render();
</script>
</body>
</html>
